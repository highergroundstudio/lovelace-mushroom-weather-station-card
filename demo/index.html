<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mushroom Weather Station Card · Demo</title>
  <style>
    :root {
      --primary-text-color: #e8eaed;
      --secondary-text-color: #9aa0a6;
      --card-background-color: #1e2228;
      --ha-card-background: #1e2228;
      --secondary-background-color: rgba(255, 255, 255, 0.06);
      --divider-color: #3c4043;
      --warning-color: #f9ab00;
      --error-color: #f28b82;
      --success-color: #81c995;
      --cyan-color: #4dd0e1;
      --teal-color: #26a69a;
      --blue-color: #64b5f6;
      --orange-color: #ffb74d;
      --amber-color: #ffd54f;
      --green-color: #81c995;
      --red-color: #e57373;
      --purple-color: #ba68c8;
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #243044, #12151a 55%);
      color: var(--primary-text-color);
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--secondary-text-color); margin: 0 0 20px; }
    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      max-width: 1200px;
    }
    ha-card, mushroom-weather-station-card {
      display: block;
    }
    ha-icon {
      display: inline-block;
      width: 22px;
      height: 22px;
      background: currentColor;
      -webkit-mask: var(--icon-mask) center / contain no-repeat;
      mask: var(--icon-mask) center / contain no-repeat;
      opacity: 0.9;
    }
    /* Simple glyph fallbacks via CSS content when mask unavailable */
    ha-icon::before {
      content: "●";
      font-size: 14px;
      line-height: 22px;
      display: block;
      text-align: center;
      color: inherit;
      background: transparent;
    }
    ha-icon {
      background: transparent;
      -webkit-mask: none;
      mask: none;
    }
  </style>
</head>
<body>
  <h1>Mushroom Weather Station Card · v0.6.0 demo</h1>
  <p>Mock Home Assistant states — polished layout, custom section order (rain before wind), soil/lightning/PM2.5, forecast precip %, stale chip.</p>
  <div class="grid">
    <div id="full"></div>
    <div id="stale"></div>
    <div id="compact"></div>
  </div>

  <script type="module">
    // Minimal ha-card / ha-icon stand-ins for offline demo
    if (!customElements.get("ha-card")) {
      customElements.define("ha-card", class extends HTMLElement {});
    }
    if (!customElements.get("ha-icon")) {
      customElements.define("ha-icon", class extends HTMLElement {
        static get observedAttributes() { return ["icon"]; }
        attributeChangedCallback() { this.title = this.getAttribute("icon") || ""; }
      });
    }

    await import("../dist/mushroom-weather-station-card.js");

    const now = Date.now();
    const fresh = new Date(now - 2 * 60 * 1000).toISOString();
    const stale = new Date(now - 90 * 60 * 1000).toISOString();

    function sensor(id, state, attrs = {}, updated = fresh) {
      return {
        entity_id: id,
        state: String(state),
        last_updated: updated,
        last_changed: updated,
        attributes: { friendly_name: id, ...attrs },
      };
    }

    function buildHass(updated = fresh) {
      const states = {
        "sensor.ws_temperature": sensor("sensor.ws_temperature", 71.2, { unit_of_measurement: "°F", device_class: "temperature" }, updated),
        "sensor.ws_feels_like": sensor("sensor.ws_feels_like", 71.0, { unit_of_measurement: "°F" }, updated),
        "sensor.ws_humidity": sensor("sensor.ws_humidity", 46, { unit_of_measurement: "%" }, updated),
        "sensor.ws_dew_point": sensor("sensor.ws_dew_point", 49.1, { unit_of_measurement: "°F" }, updated),
        "sensor.ws_temp_max": sensor("sensor.ws_temp_max", 78, { unit_of_measurement: "°F" }, updated),
        "sensor.ws_temp_min": sensor("sensor.ws_temp_min", 58, { unit_of_measurement: "°F" }, updated),
        "sensor.ws_wind_speed": sensor("sensor.ws_wind_speed", 6.4, { unit_of_measurement: "mph" }, updated),
        "sensor.ws_wind_gust": sensor("sensor.ws_wind_gust", 11.2, { unit_of_measurement: "mph" }, updated),
        "sensor.ws_max_gust": sensor("sensor.ws_max_gust", 18.0, { unit_of_measurement: "mph" }, updated),
        "sensor.ws_wind_direction": sensor("sensor.ws_wind_direction", "SE", {}, updated),
        "sensor.ws_precipitation_intensity": sensor("sensor.ws_precipitation_intensity", 0, { unit_of_measurement: "in/h" }, updated),
        "sensor.ws_daily_rain": sensor("sensor.ws_daily_rain", 0.24, { unit_of_measurement: "in" }, updated),
        "sensor.ws_event_rain": sensor("sensor.ws_event_rain", 0.24, { unit_of_measurement: "in" }, updated),
        "sensor.ws_weekly_rain": sensor("sensor.ws_weekly_rain", 0.61, { unit_of_measurement: "in" }, updated),
        "sensor.ws_monthly_rain": sensor("sensor.ws_monthly_rain", 1.42, { unit_of_measurement: "in" }, updated),
        "sensor.ws_yearly_rain": sensor("sensor.ws_yearly_rain", 9.8, { unit_of_measurement: "in" }, updated),
        "sensor.ws_last_rain": sensor("sensor.ws_last_rain", new Date(now - 5 * 3600 * 1000).toISOString(), { device_class: "timestamp" }, updated),
        "sensor.ws_uv_index": sensor("sensor.ws_uv_index", 4, {}, updated),
        "sensor.ws_irradiance": sensor("sensor.ws_irradiance", 420, { unit_of_measurement: "W/m²" }, updated),
        "sensor.ws_solar_rad_lx": sensor("sensor.ws_solar_rad_lx", 18000, { unit_of_measurement: "lx" }, updated),
        "sensor.ws_relative_pressure": sensor("sensor.ws_relative_pressure", 30.05, { unit_of_measurement: "inHg" }, updated),
        "sensor.ws_absolute_pressure": sensor("sensor.ws_absolute_pressure", 29.72, { unit_of_measurement: "inHg" }, updated),
        "sensor.ws_indoor_temperature": sensor("sensor.ws_indoor_temperature", 72.5, { unit_of_measurement: "°F" }, updated),
        "sensor.ws_indoor_humidity": sensor("sensor.ws_indoor_humidity", 38, { unit_of_measurement: "%" }, updated),
        "sensor.ws_co2": sensor("sensor.ws_co2", 640, { unit_of_measurement: "ppm" }, updated),
        "sensor.ws_pm25": sensor("sensor.ws_pm25", 18, { unit_of_measurement: "µg/m³" }, updated),
        "sensor.ws_soil_moisture_1": sensor("sensor.ws_soil_moisture_1", 42, { unit_of_measurement: "%" }, updated),
        "sensor.ws_soil_moisture_2": sensor("sensor.ws_soil_moisture_2", 28, { unit_of_measurement: "%" }, updated),
        "sensor.ws_lightning_num": sensor("sensor.ws_lightning_num", 3, { unit_of_measurement: "strikes" }, updated),
        "sensor.ws_lightning": sensor("sensor.ws_lightning", 8, { unit_of_measurement: "mi" }, updated),
        "sensor.ws_lightning_time": sensor("sensor.ws_lightning_time", new Date(now - 40 * 60 * 1000).toISOString(), {}, updated),
        "binary_sensor.ws_battery": {
          entity_id: "binary_sensor.ws_battery",
          state: "off",
          last_updated: updated,
          last_changed: updated,
          attributes: { device_class: "battery" },
        },
        "sensor.ws_battery_pct": sensor("sensor.ws_battery_pct", 87, { unit_of_measurement: "%", device_class: "battery" }, updated),
        "weather.home": {
          entity_id: "weather.home",
          state: "partlycloudy",
          last_updated: updated,
          last_changed: updated,
          attributes: {
            temperature: 71,
            temperature_unit: "°F",
            forecast: [
              { datetime: new Date(now).toISOString(), condition: "sunny", temperature: 78, templow: 58, precipitation_probability: 10 },
              { datetime: new Date(now + 86400000).toISOString(), condition: "rainy", temperature: 70, templow: 55, precipitation_probability: 70 },
              { datetime: new Date(now + 2 * 86400000).toISOString(), condition: "cloudy", temperature: 68, templow: 52, precipitation_probability: 40 },
              { datetime: new Date(now + 3 * 86400000).toISOString(), condition: "partlycloudy", temperature: 73, templow: 54, precipitation_probability: 20 },
              { datetime: new Date(now + 4 * 86400000).toISOString(), condition: "sunny", temperature: 76, templow: 56, precipitation_probability: 5 },
            ],
          },
        },
      };
      const forecast = states["weather.home"].attributes.forecast;
      return {
        states,
        locale: { language: "en" },
        callService() {},
        // Minimal mock so attribute forecasts are not wiped by a null connection.
        connection: {
          async subscribeMessage(cb) {
            queueMicrotask(() => cb({ forecast }));
            return () => {};
          },
          async sendMessagePromise() {
            return { response: { "weather.home": { forecast } } };
          },
        },
      };
    }

    function mount(hostId, config, hass) {
      const el = document.createElement("mushroom-weather-station-card");
      el.setConfig(config);
      el.hass = hass;
      document.getElementById(hostId).appendChild(el);
      return el;
    }

    const base = {
      type: "custom:mushroom-weather-station-card",
      name: "Backyard Station",
      prefix: "ws",
      layout: "full",
      unit_system: "imperial",
      show_forecast: true,
      weather_entity: "weather.home",
      forecast_days: 5,
      show_updated: true,
      show_beaufort: true,
      stale_minutes: 30,
      labels: { soil_moisture_1: "Raised bed", soil_moisture_2: "Lawn" },
      section_order: [
        "conditions", "rain", "wind", "sun", "soil",
        "lightning", "air", "station", "forecast", "battery",
      ],
    };

    mount("full", base, buildHass(fresh));
    mount("stale", { ...base, name: "Stale Station (90m)" }, buildHass(stale));
    mount("compact", { ...base, name: "Compact", layout: "compact", show_beaufort: false }, buildHass(fresh));

    // Drive a pressure change so trend can flip after a second update
    setTimeout(() => {
      const card = document.querySelector("#full mushroom-weather-station-card");
      if (!card) return;
      const hass = buildHass(fresh);
      hass.states["sensor.ws_relative_pressure"].state = "30.12";
      card.hass = hass;
      setTimeout(() => {
        hass.states["sensor.ws_relative_pressure"].state = "30.18";
        hass.states["sensor.ws_relative_pressure"].last_updated = new Date().toISOString();
        card.hass = hass;
      }, 200);
    }, 300);
  </script>
</body>
</html>
